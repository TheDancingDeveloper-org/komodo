# Keep the fork at parity with upstream Komodo.
#
# Watches moghtech/komodo for new releases, replays this fork's patch series
# onto each one, and proves the result still builds and still fails closed.
# On success it opens a PR; on conflict or failure it opens an issue saying
# exactly what broke. Nothing is merged or deployed automatically.
name: Upstream parity

on:
  schedule:
    # Daily, well outside the estate's backup and collector windows.
    - cron: '17 14 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Upstream tag to rebase onto (default: newest release)'
        type: string
        required: false

# No `pull-requests: write`. The organization disallows GitHub Actions creating
# or approving pull requests, across every repo. That is a deliberate security
# control and not something this workflow should have loosened, so a clean
# rebase is reported as an issue with the branch pushed and ready, and a human
# opens the PR if they want one.
permissions:
  contents: write
  issues: write

concurrency:
  group: komodo-upstream-parity
  cancel-in-progress: false

jobs:
  parity:
    # Pure Rust plus git/curl/jq; nothing here is node-b specific, so this
    # daily job does not need to queue behind node-b's publish work.
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt

      - name: Work out whether upstream has moved
        id: check
        run: |
          set -euo pipefail
          git config user.name  "komodo-parity-bot"
          git config user.email "sprooty@sprooty.com"
          git remote add upstream https://github.com/moghtech/komodo.git 2>/dev/null || true
          git fetch --tags --quiet upstream
          git fetch --quiet origin tdd/patches

          if [ -n "${{ inputs.tag }}" ]; then
            target="${{ inputs.tag }}"
            git rev-parse --verify --quiet "refs/tags/$target" >/dev/null \
              || { echo "::error::tag $target does not exist upstream"; exit 1; }
          else
            # Release tags only -- upstream also publishes -dev-N prereleases,
            # which are not parity targets.
            target="$(git tag -l 'v[0-9]*' --sort=-v:refname | grep -v -- '-dev-' | head -1)"
          fi

          # The tag the series currently sits on. The series is short, so its
          # base is the newest tag that is an ancestor of its root commit.
          base="$(git describe --tags --abbrev=0 --exclude='*-dev-*' \
                  "$(git rev-list origin/tdd/patches --not --tags='v[0-9]*' | tail -1)^" 2>/dev/null || true)"

          echo "base=$base"     >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"
          if [ "$base" = "$target" ]; then
            echo "uptodate=true" >> "$GITHUB_OUTPUT"
            echo "Already based on $target - nothing to do."
          else
            echo "uptodate=false" >> "$GITHUB_OUTPUT"
            echo "Upstream moved: $base -> $target"
          fi

      - name: Replay the patch series onto the new release
        id: rebase
        if: steps.check.outputs.uptodate == 'false'
        continue-on-error: true
        run: |
          set -euo pipefail
          git checkout -q -B "tdd/rebase/${{ steps.check.outputs.target }}" origin/tdd/patches
          git rebase --onto "${{ steps.check.outputs.target }}" "${{ steps.check.outputs.base }}"

      - name: Capture the conflict, if it did not apply cleanly
        id: conflict
        if: steps.check.outputs.uptodate == 'false' && steps.rebase.outcome == 'failure'
        run: |
          {
            echo 'files<<CONFLICT_EOF'
            git diff --name-only --diff-filter=U || true
            echo 'CONFLICT_EOF'
          } >> "$GITHUB_OUTPUT"
          git rebase --abort || true

      # A new upstream release moves dependency versions, so the lockfile our
      # series carries is stale by definition after a rebase. Refresh it and
      # commit it, exactly as a human would -- then verify. `--locked` is
      # deliberately absent here for that reason, while the Core image workflow
      # keeps it, where the lockfile genuinely should not move.
      - name: Refresh the lockfile for the new upstream release
        id: lockfile
        if: steps.check.outputs.uptodate == 'false' && steps.rebase.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          cargo fetch
          if ! git diff --quiet Cargo.lock; then
            git add Cargo.lock
            git commit -m "chore: refresh Cargo.lock for ${{ steps.check.outputs.target }}"
            echo "Cargo.lock refreshed"
          else
            echo "Cargo.lock unchanged"
          fi

      - name: Verify the rebased series
        id: verify
        if: steps.check.outputs.uptodate == 'false' && steps.rebase.outcome == 'success' && steps.lockfile.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          cargo fmt -p infisical -p interpolate --check
          cargo test -p infisical -p interpolate
          cargo check -p komodo_core -p komodo_periphery

      - name: Publish the rebased branch and report it is ready
        if: steps.check.outputs.uptodate == 'false' && steps.rebase.outcome == 'success' && steps.verify.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          API: ${{ github.api_url }}
          SERVER: ${{ github.server_url }}
          TARGET: ${{ steps.check.outputs.target }}
          BASE: ${{ steps.check.outputs.base }}
        run: |
          set -euo pipefail
          git push --force-with-lease origin "tdd/rebase/$TARGET"

          title="Parity: upstream $TARGET applies cleanly - ready to promote"

          # The runner image has no `gh`, so this talks to the REST API directly
          # and uses `jq` to build and read JSON rather than hand-escaping it.
          #
          # Each result is assigned to a variable BEFORE being tested. Inside an
          # `if` condition `set -e` does not apply, so a failing command
          # substitution there would silently evaluate as empty -- which is
          # exactly how an earlier version reported "already open" and exited 0
          # after its JSON tool turned out to be missing.
          query="$(jq -rn --arg q "repo:$REPO is:issue is:open in:title $title" '$q|@uri')"
          found="$(curl -sS -f -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" "$API/search/issues?q=$query")"
          total="$(jq -r '.total_count' <<< "$found")"
          case "$total" in
            ''|*[!0-9]*) echo "::error::could not read the open issue count"; exit 1 ;;
          esac
          if [ "$total" != "0" ]; then
            echo "Already reported for $TARGET"
            exit 0
          fi

          {
            echo "Upstream released \`$TARGET\`. The patch series replayed from \`$BASE\` with no"
            echo "conflicts, and passed:"
            echo
            echo "- \`cargo fmt\` on the fork-owned crates"
            echo "- \`cargo test -p infisical -p interpolate\` (including the fail-closed guard)"
            echo "- \`cargo check -p komodo_core -p komodo_periphery\`"
            echo
            echo "The lockfile was refreshed for this release and committed onto the branch."
            echo
            echo "Branch: [\`tdd/rebase/$TARGET\`]($SERVER/$REPO/tree/tdd/rebase/$TARGET)"
            echo "Compare: $SERVER/$REPO/compare/tdd/patches...tdd/rebase/$TARGET"
            echo
            echo "**A clean rebase is not a deployment.** Before promoting, follow"
            echo "\`docs/tdd/MAINTENANCE.md\`, then build the image and re-run the canary checks in"
            echo "\`docs/tdd/CANARY-2026-08-19.md\` -- both defects found so far were invisible to"
            echo "the test suite and only appeared against a live Core."
            echo
            echo "Promoting:"
            echo
            echo '```'
            echo "git branch -f tdd/patches         tdd/rebase/$TARGET"
            echo "git branch -f tdd/release/$TARGET tdd/rebase/$TARGET"
            echo "git push origin tdd/patches tdd/release/$TARGET"
            echo '```'
            echo
            echo "Reported by the Upstream parity workflow. It does not open the PR itself:"
            echo "the organization disallows GitHub Actions creating pull requests, which is a"
            echo "deliberate control this workflow should not work around."
          } > /tmp/parity-body.md

          payload="$(jq -n --arg title "$title" --rawfile body /tmp/parity-body.md \
            '{title: $title, body: $body}')"
          curl -sS -f -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$API/repos/$REPO/issues" -d "$payload" > /dev/null
          echo "Reported: $title"

      - name: Report a conflict or a failed verification
        if: steps.check.outputs.uptodate == 'false' && (steps.rebase.outcome == 'failure' || steps.lockfile.outcome == 'failure' || steps.verify.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          API: ${{ github.api_url }}
          TARGET: ${{ steps.check.outputs.target }}
          BASE: ${{ steps.check.outputs.base }}
          CONFLICTS: ${{ steps.conflict.outputs.files }}
          REBASE: ${{ steps.rebase.outcome }}
          LOCKFILE: ${{ steps.lockfile.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "$REBASE" = "failure" ]; then
            what="conflicted"
          elif [ "$LOCKFILE" = "failure" ]; then
            what="failed to resolve dependencies"
          else
            what="failed verification"
          fi
          title="Parity: patch series $what on upstream $TARGET"

          query="$(jq -rn --arg q "repo:$REPO is:issue is:open in:title $title" '$q|@uri')"
          found="$(curl -sS -f -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" "$API/search/issues?q=$query")"
          total="$(jq -r '.total_count' <<< "$found")"
          case "$total" in
            ''|*[!0-9]*) echo "::error::could not read the open issue count"; exit 1 ;;
          esac
          if [ "$total" != "0" ]; then
            echo "Issue already open"
            exit 0
          fi

          {
            echo "Replaying the patch series from \`$BASE\` onto upstream \`$TARGET\` **$what**."
            echo
            echo "Conflicted files (empty if this was not a rebase conflict):"
            echo '```'
            echo "${CONFLICTS:-none}"
            echo '```'
            echo
            echo "Only four upstream files are touched by this series, so diagnosis is quick --"
            echo "see the conflict table in \`docs/tdd/MAINTENANCE.md\`. To reproduce locally:"
            echo
            echo '```'
            echo "./scripts/tdd/sync-upstream.sh $TARGET"
            echo '```'
            echo
            echo "If the conflict is in \`Cargo.toml\`, keep **upstream's** dependency versions and"
            echo "re-add ours, and make sure they sit in the trailing \`# FORK\` block -- that block"
            echo "exists precisely to stop this recurring."
            echo
            echo "Opened by the Upstream parity workflow ([run]($RUN_URL))."
          } > /tmp/parity-issue-body.md

          payload="$(jq -n --arg title "$title" --rawfile body /tmp/parity-issue-body.md \
            '{title: $title, body: $body}')"

          curl -sS -f -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$API/repos/$REPO/issues" -d "$payload" > /dev/null
          echo "Opened issue: $title"

      - name: Fail the run if parity is broken
        if: steps.check.outputs.uptodate == 'false' && (steps.rebase.outcome == 'failure' || steps.lockfile.outcome == 'failure' || steps.verify.outcome == 'failure')
        run: exit 1

      - name: Summary
        if: always()
        run: |
          {
            echo "### Upstream parity"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Series base | \`${{ steps.check.outputs.base }}\` |"
            echo "| Newest upstream release | \`${{ steps.check.outputs.target }}\` |"
            echo "| Up to date | ${{ steps.check.outputs.uptodate }} |"
            echo "| Rebase | ${{ steps.rebase.outcome || 'skipped' }} |"
            echo "| Lockfile | ${{ steps.lockfile.outcome || 'skipped' }} |"
            echo "| Verify | ${{ steps.verify.outcome || 'skipped' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
