# Build and publish the fork's Komodo Core image.
#
# Only Core is built. Secret interpolation happens entirely in Core, so every
# Periphery in the estate keeps running the stock upstream image -- see
# docs/tdd/DEPLOYMENT.md.
name: Core image

on:
  push:
    branches: ['tdd/release/**', 'tdd/patches']
    paths-ignore: ['docs/**', '*.md']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Push the image to the registry'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: komodo-core-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: repo.indexarr.net
  IMAGE: repo.indexarr.net/indexarr/komodo-core-infisical

jobs:
  test:
    # Pure Rust, no node-b dependency -- so it may use any rust runner in the
    # pool rather than contending with the publish jobs for node-b.
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v7

      # Pinned to the toolchain the fork's Dockerfile builds with, so CI cannot
      # pass on a compiler the image will not use.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt

      # Scoped to the crates this fork owns or changes. `--all` would gate our
      # CI on upstream's formatting, which we do not control and must not fight.
      - name: Formatting (fork-owned crates)
        run: cargo fmt -p infisical -p interpolate -p names_diff -p komodo_mcp --check

      - name: Unit and integration tests
        run: cargo test -p infisical -p interpolate -p names_diff -p komodo_mcp --locked

      # The guard is the safety-critical part: if it stops failing closed, a
      # failed secret lookup would deploy a literal token as a password.
      - name: Guard must fail closed
        run: |
          cargo test -p interpolate --locked -- \
            refuses_to_pass_through_an_unresolved_infisical_token --exact --nocapture

      # Cheaper than a full image build and catches an upstream API change in
      # the hook before we spend ten minutes compiling.
      - name: Both binaries still build
        run: cargo check -p komodo_core -p komodo_periphery --locked

      # Attribution + names-only change records hooked into Core (WI-865).
      - name: Core fork hooks
        # OOM on aws-sdk-ec2; operator exception 2026-10-27.
        env:
          CARGO_BUILD_JOBS: "4"
        run: "cargo test -p komodo_core --locked tdd::"

  image:
    needs: test
    runs-on: [self-hosted, docker, publish]
    # Serialised across ALL refs, not just this one. The workflow-level group is
    # ref-scoped, so pushing tdd/patches and tdd/release/* together started two
    # full Rust release builds on the same node-b daemon at once and one died
    # with a buildx transport error. `cancel-in-progress: false` so a release
    # build queues behind a patches build rather than being thrown away.
    concurrency:
      group: komodo-core-image-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so an ancestor tag can be described. The fork does not
          # publish upstream's release tags, so the version step fetches those
          # from moghtech/komodo when Cargo.toml no longer carries a version.
          fetch-depth: 0

      # Authenticate to Docker Hub first: the build pulls rust, debian and deno
      # base images from it, and unauthenticated pulls hit the shared runner's
      # rate limit.
      - name: Authenticate to Docker Hub (base image pull rate limit)
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: x-access-token
          password: ${{ secrets.FORGEJO_TOKEN }}

      # The upstream release this build is based on. It drives both the image
      # tag and which upstream UI image is pulled in, so the two can never
      # disagree.
      #
      # From v2.3.4, workspace.package.version is "0.0.0" and the published UI
      # is ghcr.io/moghtech/komodo-ui:2 (see bin/core/multi-arch.Dockerfile),
      # not komodo-ui:<cargo version>. The nearest ancestor tag is the release
      # this branch was rebased onto.
      - name: Resolve the upstream version
        id: version
        run: |
          set -euo pipefail
          version="$(sed -n '/^\[workspace.package\]/,/^\[/p' Cargo.toml \
            | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)"
          # v2.3.4 and later publish the workspace version as 0.0.0. The fork
          # does not carry upstream's tags, so describe them from moghtech/komodo.
          if [ -z "$version" ] || [ "$version" = "0.0.0" ]; then
            git fetch --tags --quiet https://github.com/moghtech/komodo.git
            version="$(git describe --tags --abbrev=0 --exclude='*-dev-*' --match 'v[0-9]*')"
            version="${version#v}"
          fi
          test -n "$version"
          test "$version" != "0.0.0"
          # ghcr.io/moghtech/komodo-ui is published as the major (":2"), not
          # the full release (":2.3.4"). The image tag keeps the full release.
          ui="${version%%.*}"
          test -n "$ui"
          echo "komodo=$version" >> "$GITHUB_OUTPUT"
          echo "ui=$ui" >> "$GITHUB_OUTPUT"
          echo "Upstream base: $version (UI tag $ui)"

      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: scripts/tdd/core-only.Dockerfile
          # node-b is x86_64 and is the only host running Core. No multi-arch.
          platforms: linux/amd64
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
          provenance: false
          build-args: |
            KOMODO_VERSION=${{ steps.version.outputs.ui }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.komodo }}-infisical
            ${{ env.IMAGE }}:${{ steps.version.outputs.komodo }}-infisical-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.komodo }}-infisical

      - name: Summary
        run: |
          {
            echo "### Komodo Core image"
            echo ""
            echo '```'
            echo "${{ env.IMAGE }}:${{ steps.version.outputs.komodo }}-infisical"
            echo "${{ env.IMAGE }}:${{ steps.version.outputs.komodo }}-infisical-${{ github.sha }}"
            echo '```'
            echo ""
            echo "Upstream base: \`${{ steps.version.outputs.komodo }}\` - Periphery unchanged."
          } >> "$GITHUB_STEP_SUMMARY"
